name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        name: Typecheck, tests and build
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: 24
                  package-manager-cache: false
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
              with:
                  cache: true
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Prepare local test configuration
              run: pnpm setup:local
            - name: Check the platform
              run: pnpm check

    browser:
        name: Browser flows
        needs: checks
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: 24
                  package-manager-cache: false
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
              with:
                  cache: true
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Install Chromium
              run: pnpm exec playwright install --with-deps chromium
            - name: Prepare local test configuration and database
              run: |
                  pnpm setup:local
                  pnpm db:migrate
            - name: Test the browser flows
              run: pnpm test:e2e
            - name: Upload browser report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7
                  if-no-files-found: ignore
