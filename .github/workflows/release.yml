name: Prepare source release

on:
    workflow_dispatch:
        inputs:
            tag:
                description: Existing version tag at the main commit selected for this run (for example v0.1.0)
                required: true
                type: string

permissions:
    contents: read

concurrency:
    group: source-release
    cancel-in-progress: false

jobs:
    validate:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: 24
                  package-manager-cache: false
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
            - run: pnpm install --frozen-lockfile
            - name: Validate exact release tag
              env:
                  RELEASE_TAG: ${{ inputs.tag }}
              run: node scripts/pack-release.mjs --check --tag "$RELEASE_TAG"

    ci:
        needs: validate
        uses: ./.github/workflows/ci.yml

    package:
        needs: ci
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: 24
                  package-manager-cache: false
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
            - run: pnpm install --frozen-lockfile
            - run: pnpm licenses:generate
            - name: Package source and create a draft release
              env:
                  RELEASE_TAG: ${{ inputs.tag }}
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  node scripts/pack-release.mjs --tag "$RELEASE_TAG"
                  gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG" --notes-file work/releases/*/release-notes.md work/releases/*/loginflare-*.tar.gz work/releases/*/SHA256SUMS work/releases/*/provenance.json
